<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fact checker</title>
  <meta name="description" content="Paste a message or screenshot. Get a verdict for each claim, with sources.">
  <meta property="og:title" content="Fact checker">
  <meta property="og:description" content="Paste a message or screenshot. Get a verdict for each claim, with sources.">
  <meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
  <!-- Inline, so the icon changes with the page: browsers cache icon files apart from it. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2318181b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cstyle%3E@media (prefers-color-scheme: dark) { svg { stroke: %23ededef } }%3C/style%3E%3Cpath d='M7.9 20A9 9 0 1 0 4 16.1L2 22Z'/%3E%3Cpath d='m9 12 2 2 4-4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Noto+Sans+Devanagari:wght@400..600&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body class="empty">
  <button type="button" class="history-toggle" popovertarget="history" aria-label="Recent checks" title="Recent checks">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
  </button>
  <nav id="history" class="history" popover aria-labelledby="history-heading">
    <button type="button" class="start">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      New check
    </button>
    <h2 id="history-heading">Recent</h2>
    <ul></ul>
  </nav>

  <main>
    <h1 class="greeting">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="m9 12 2 2 4-4"/></svg>
      What should we check?
    </h1>
    <section class="report" aria-live="polite"></section>
  </main>

  <footer>
    <form class="composer">
      <div class="attachment" hidden>
        <button type="button" class="remove" aria-label="Remove screenshot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <textarea name="text" rows="1" maxlength="4000" placeholder="Paste a message or screenshot"
                aria-label="Message to check"></textarea>
      <div class="actions">
        <button type="button" class="attach" aria-label="Add a screenshot" title="Add a screenshot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        </button>
        <input type="file" accept="image/png,image/jpeg,image/webp" hidden>
        <button class="send" aria-label="Check" title="Check" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        </button>
      </div>
    </form>
    <p class="problem" role="alert" hidden></p>
    <div class="examples">
      <button type="button" data-text="UNESCO has declared Jana Gana Mana the best national anthem in the world.">UNESCO's best national anthem</button>
      <button type="button" data-text="Japanese doctors advise: drinking hot water every 15 minutes washes the coronavirus into the stomach, where acid kills it.">Hot water kills the virus</button>
      <button type="button" lang="hi" data-text="नासा ने पुष्टि की है कि दिसंबर में पृथ्वी पर 6 दिन तक पूरा अंधेरा रहेगा।">दिसंबर में 6 दिन अंधेरा</button>
    </div>
    <button type="button" class="new-check" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      New check
    </button>
    <p class="note">Verdicts can be wrong. Check the sources.</p>
  </footer>

  <template id="verdict-icons">
    <svg data-verdict="true" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    <svg data-verdict="false" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    <svg data-verdict="misleading" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    <svg data-verdict="unverifiable" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
    <svg class="chevron" data-icon="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    <svg data-icon="copy" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
  </template>
</body>
</html>
