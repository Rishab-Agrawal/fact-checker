[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#c96442"
backgroundColor = "#faf9f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#29261b"
borderColor = "#e3dfd3"
linkColor = "#a8502f"
redTextColor = "#a8322d"
orangeTextColor = "#9a4a0c"
greenTextColor = "#25693a"
grayTextColor = "#5e5a4e"
grayBackgroundColor = "#e1e0db"
font = "Literata:https://fonts.googleapis.com/css2?family=Literata:wght@400;500;600&display=swap"
headingFontWeights = 400
showWidgetBorder = true
baseRadius = "0.75rem"
buttonRadius = "full"
