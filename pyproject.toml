[project]
name = "fact-checker"
version = "0.1.0"
description = "Checks forwarded messages: claim extraction, parallel research, debate, verdicts"
readme = "README.md"
authors = [
    { name = "rishab", email = "rishabsecond@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.7.2",
    "langchain-postgres>=0.0.19",
    "langchain-tavily>=0.2.18",
    "langchain-typesafe>=0.0.1a3",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
